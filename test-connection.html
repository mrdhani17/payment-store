<!DOCTYPE html>
<html>
<head>
  <title>Supabase Connection Test</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #0a0a0f;
      color: white;
    }
    .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
    .success { background: #10b981; }
    .error { background: #ef4444; }
    .warning { background: #f59e0b; }
    pre { background: #1a1a1f; padding: 10px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>🔍 Supabase Connection Test</h1>
  <div id="status">Testing...</div>
  <div id="details"></div>

  <script type="module">
    const status = document.getElementById('status');
    const details = document.getElementById('details');

    // Check environment variables (these should be in your .env file)
    const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL;
    const SUPABASE_KEY = import.meta.env.VITE_SUPABASE_ANON_KEY;

    if (!SUPABASE_URL || !SUPABASE_KEY) {
      status.innerHTML = '<div class="status error">❌ Environment variables not loaded</div>';
      details.innerHTML = `
        <p>Make sure:</p>
        <ol>
          <li>You have a .env file in the project root</li>
          <li>It contains VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY</li>
          <li>You restarted the dev server after creating .env</li>
        </ol>
      `;
    } else {
      status.innerHTML = '<div class="status success">✅ Environment variables loaded!</div>';
      details.innerHTML = `
        <p><strong>Supabase URL:</strong> ${SUPABASE_URL}</p>
        <p><strong>Key:</strong> ${SUPABASE_KEY.substring(0, 20)}...</p>
        <p>Now testing database connection...</p>
      `;

      // Try to fetch from Supabase
      fetch(`${SUPABASE_URL}/rest/v1/theme_settings?id=eq.1`, {
        headers: {
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.length > 0) {
          status.innerHTML += '<div class="status success">✅ Successfully connected to Supabase!</div>';
          details.innerHTML += `<pre>${JSON.stringify(data[0].settings, null, 2)}</pre>`;
        } else {
          status.innerHTML += '<div class="status warning">⚠️ Connected but no theme data found</div>';
          details.innerHTML += '<p>Run the SQL script from SUPABASE_SETUP.md</p>';
        }
      })
      .catch(err => {
        status.innerHTML += '<div class="status error">❌ Connection failed</div>';
        details.innerHTML += `<pre>${err.message}</pre>`;
      });
    }
  </script>
</body>
</html>
